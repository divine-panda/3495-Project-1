name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create temporary CI environment
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_root_password
          MYSQL_USER=ci_user
          MYSQL_PASSWORD=ci_password
          MYSQL_DATABASE=data_collection
          JWT_SECRET_KEY=ci-only-test-secret-not-for-production
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build all service images
        run: docker compose build

      - name: Start services and wait for health checks
        run: docker compose up -d --wait --wait-timeout 180

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Clean up CI containers
        if: always()
        run: docker compose down -v
