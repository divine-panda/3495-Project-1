name: Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  permissions:
    contents: read
    packages: write

jobs:
  build-and-health-check:
    runs-on: ubuntu-24.04 

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Create temporary CI environment
        run: |
          cat > .env <<'EOF'
          MYSQL_ROOT_PASSWORD=ci_root_password
          MYSQL_USER=ci_user
          MYSQL_PASSWORD=ci_password
          MYSQL_DATABASE=data_collection
          JWT_SECRET_KEY=ci-only-test-secret-not-for-production
          EOF

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build all service images
        run: docker compose build

      - name: Scan auth service image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acit3495-auth-service:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan enter data image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acit3495-enter-data:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan analytics image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acit3495-analytics-service:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Scan show results image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: acit3495-show-results:latest
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'

      - name: Start services and wait for health checks
        run: docker compose up -d --wait --wait-timeout 180

      - name: Run tests
        run: |
          python -m unittest discover -s tests -v 2>&1 | tee test-results.txt

      - name: Show test results in GitHub Actions
        if: always()
        run: |
          {
            echo "## Test Results"
            echo '```text'
            cat test-results.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Show service status
        if: always()
        run: docker compose ps

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and publish Docker images
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -e

          REPO_LOWER=$(echo "$REPOSITORY" | tr '[:upper:]' '[:lower:]')
          IMAGE_PREFIX="ghcr.io/$REPO_LOWER"

          docker tag acit3495-auth-service:latest "$IMAGE_PREFIX/auth-service:latest"
          docker tag acit3495-enter-data:latest "$IMAGE_PREFIX/enter-data:latest"
          docker tag acit3495-analytics-service:latest "$IMAGE_PREFIX/analytics-service:latest"
          docker tag acit3495-show-results:latest "$IMAGE_PREFIX/show-results:latest"

          docker push "$IMAGE_PREFIX/auth-service:latest"
          docker push "$IMAGE_PREFIX/enter-data:latest"
          docker push "$IMAGE_PREFIX/analytics-service:latest"
          docker push "$IMAGE_PREFIX/show-results:latest"

      - name: Clean up CI containers
        if: always()
        run: docker compose down -v
